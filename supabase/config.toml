
[functions.speak-answer]
enabled = true
# The client sends the signed-in user's JWT; the gateway must verify it.
# Never set this to false: the function bills Gemini TTS usage.
verify_jwt = true
import_map = "./functions/speak-answer/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/speak-answer/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/speak-answer/*.html" ]
